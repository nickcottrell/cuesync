# Cuesync Schedule Configuration
# Edit this file to change what runs and when

# Sync interval - pull latest maestro code (adjust this number as needed)
sync_interval: "*/30 * * * *"  # Every 30 minutes

# Scheduled cuesheets
cuesheets:
  - name: morning-workflow
    schedule: "0 9 * * *"      # 9am daily (Pacific Time)
    enabled: true
    description: "Daily acquisition + approval cue"

  - name: release-train
    schedule: "0 10 * * *"     # 10am daily (Pacific Time)
    enabled: true
    description: "Execute approved sprint plans"

# Notification settings (optional, not yet implemented)
notifications:
  on_failure: true
  on_success: false
  email: ""

# Server timezone
timezone: "America/Los_Angeles"  # Pacific Time
