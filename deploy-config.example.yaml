# Cuesync Deployment Configuration
# Copy this file to deploy-config.yaml and fill in your server details
# ⚠️  deploy-config.yaml should NOT be committed (contains server credentials)

# Server connection
server:
  host: "your-server.example.com"  # AWS Lightsail IP or hostname
  user: "ubuntu"                    # SSH user
  ssh_key: "~/.ssh/id_rsa"         # Path to SSH key
  port: 22                          # SSH port

# Deployment paths
paths:
  remote_dir: "/home/ubuntu/cuesync"  # Where cuesync is cloned on server
  maestro_dir: "/home/ubuntu/cuesync/maestro"  # Maestro submodule path

# Git repositories
repos:
  cuesync: "https://github.com/3dmath/cuesync.git"
  maestro: "https://github.com/nickcottrell/maestro.git"

# Optional: Notifications
notifications:
  on_deploy_success: false
  on_deploy_failure: true
  webhook_url: ""  # Zapier webhook for deploy notifications
